name: real-llm-nightly

on:
  schedule:
    - cron: "30 18 * * *"  # 02:30 Asia/Shanghai
  workflow_dispatch:

jobs:
  real-llm:
    runs-on: ubuntu-latest
    env:
      OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
      OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real_llm tests
        run: pytest -m real_llm -q
