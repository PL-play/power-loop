[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-loop"
description = "Embeddable agent execution kernel — LLM loop, hooks, events, tools, dynamic sub-agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "llm", "openai", "anthropic", "tool-use", "hooks"]
authors = [{ name = "zhangran" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  "anthropic>=0.42.0",
  "openai>=1.52.0",
  "socksio>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "pypdf>=5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/deep-talk0/power-loop"
Repository = "https://github.com/deep-talk0/power-loop"
Changelog = "https://github.com/deep-talk0/power-loop/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/deep-talk0/power-loop/blob/main/ROADMAP.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "power_loop.__version__" }

[tool.setuptools.packages.find]
include = ["power_loop*", "llm_client*"]
exclude = ["tests*", "docs*", "references*", "examples*", "temp*", "images*"]

# ── ruff ──
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".skills", "references", "temp", "outputs", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line-too-long handled by formatter
  "B008",  # function calls in default args — common in dataclass-style configs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "UP"]
"examples/**" = ["B", "UP"]

# ── mypy ──
# M0 基线：能跑、不破坏 import。strict 检查留给 M1 逐模块收紧（接触哪个收紧哪个）。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# 允许类型注解不完整；接触后逐步开 disallow_untyped_defs 等。
check_untyped_defs = false

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: pure control-flow / contract tests (fake LLM, fast)",
  "integration: multi-component scenarios with fake LLM",
  "real_llm: hits the real DashScope-compatible API; default ON locally, skipped if key missing",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
