[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-loop"
description = "Embeddable agent execution kernel — LLM loop, hooks, events, tools, dynamic sub-agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "llm", "openai", "anthropic", "tool-use", "hooks"]
authors = [{ name = "zhangran", email = "zhangran24@126.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
# Featherweight core (H3.5): only what the SDK-free core actually imports. Transports
# and optional features (YAML skill frontmatter, PDF input) are extras; socksio was
# unused (httpx pulls it transitively for SOCKS) and python-dotenv is examples/tests-only.
# Zero runtime dependencies (ECO-3): the SDK-free core is pure stdlib. LLM transports,
# skills(yaml), pdf, and the observability backends are all optional extras below.
dependencies = []

[project.optional-dependencies]
# Transports are optional (H3.1): the core imports SDK-free and only pulls a
# transport when you actually construct that provider. Pick the one(s) you use:
#   pip install 'power-loop[openai]'      # OpenAI-compatible endpoints
#   pip install 'power-loop[anthropic]'   # Anthropic Messages API endpoints
#   pip install 'power-loop[all]'         # both transports + skills + pdf
anthropic = ["anthropic>=0.42.0"]
openai = ["openai>=1.52.0"]
skills = ["pyyaml>=6.0"]          # YAML frontmatter parsing in load_skill (degrades to none without it)
pdf = ["pypdf>=5.3.0"]            # PDF input parsing in the multimodal helper
prometheus = ["prometheus-client>=0.19"]  # contrib.metrics_sink PrometheusBackend (OBS-4)
statsd = ["statsd>=4.0"]                   # contrib.metrics_sink StatsDBackend (OBS-4)
otel = ["opentelemetry-sdk>=1.20"]         # contrib.otel_sink span bridge (OBS-5)
mcp = ["mcp>=1.0"]                         # contrib.mcp StdioMCPClient (ECO-1)
all = [
    "anthropic>=0.42.0", "openai>=1.52.0", "pyyaml>=6.0", "pypdf>=5.3.0",
    "prometheus-client>=0.19", "statsd>=4.0", "opentelemetry-sdk>=1.20", "mcp>=1.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "hypothesis>=6.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  # dev/test exercises both transports + the optional features + examples' .env loader
  "anthropic>=0.42.0",
  "openai>=1.52.0",
  "pyyaml>=6.0",
  "pypdf>=5.3.0",
  "python-dotenv>=1.0.0",
  # observability backends, so CI exercises the metrics + OTel sinks (OBS-4/5)
  "prometheus-client>=0.19",
  "opentelemetry-sdk>=1.20",
  # the MCP SDK, so CI runs the real-stdio-server MCP adapter test (ECO-1)
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/PL-play/power-loop"
Repository = "https://github.com/PL-play/power-loop"
Changelog = "https://github.com/PL-play/power-loop/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/PL-play/power-loop/blob/main/ROADMAP.md"

[tool.setuptools]
include-package-data = true

# PEP 561: ship the inline-types marker so downstream mypy/pyright see power-loop's
# annotations (H3.3). Without this the entire annotated public API is invisible.
[tool.setuptools.package-data]
power_loop = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "power_loop.__version__" }

[tool.setuptools.packages.find]
# llm_client is vendored under power_loop/_vendor (H3.2) — the wheel ships only the
# `power_loop` top-level package, no squat-prone bare `llm_client`.
include = ["power_loop*"]
exclude = ["tests*", "docs*", "references*", "examples*", "temp*", "images*"]

# ── ruff ──
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".skills", "references", "temp", "outputs", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line-too-long handled by formatter
  "B008",  # function calls in default args — common in dataclass-style configs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "UP"]
"examples/**" = ["B", "UP"]

# ── mypy ──
# M0 基线：能跑、不破坏 import。strict 检查留给 M1 逐模块收紧（接触哪个收紧哪个）。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# 允许类型注解不完整；接触后逐步开 disallow_untyped_defs 等。
check_untyped_defs = false

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# repo root on sys.path so the (un-packaged) `bench` harness is importable in tests.
pythonpath = ["."]
# --strict-markers: an unregistered marker is a collection error (catches typos).
# --strict-config: an unknown ini key is an error. Coverage flags are opt-in (CI).
addopts = "--strict-markers --strict-config"
markers = [
  "unit: pure control-flow / contract tests (fake LLM, fast)",
  "integration: multi-component scenarios with fake LLM",
  "real_llm: hits the real DashScope-compatible API; default ON locally, skipped if key missing",
  "bench: SCALE-1 benchmark/soak harness smoke (fast subset; full sweep via `python -m bench`)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

# ── coverage (opt-in: CI runs `pytest --cov=power_loop`) — the vendored llm_client is
# measured transitively under power_loop._vendor, so a separate target is stale (ECO-4) ──
[tool.coverage.run]
source = ["power_loop"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
]
