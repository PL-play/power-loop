[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-loop"
description = "Embeddable agent execution kernel — LLM loop, hooks, events, tools, dynamic sub-agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "llm", "openai", "anthropic", "tool-use", "hooks"]
authors = [{ name = "zhangran", email = "zhangran24@126.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  "socksio>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "pypdf>=5.3.0",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
# Vendor LLM SDKs are optional (H3.1): the core imports SDK-free and only pulls a
# transport when you actually construct that provider. Pick the one(s) you use:
#   pip install 'power-loop[openai]'      # OpenAI-compatible endpoints
#   pip install 'power-loop[anthropic]'   # Anthropic Messages API endpoints
#   pip install 'power-loop[all]'         # both
anthropic = ["anthropic>=0.42.0"]
openai = ["openai>=1.52.0"]
all = ["anthropic>=0.42.0", "openai>=1.52.0"]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "hypothesis>=6.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  # dev/test exercises both real transports
  "anthropic>=0.42.0",
  "openai>=1.52.0",
]

[project.urls]
Homepage = "https://github.com/PL-play/power-loop"
Repository = "https://github.com/PL-play/power-loop"
Changelog = "https://github.com/PL-play/power-loop/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/PL-play/power-loop/blob/main/ROADMAP.md"

[tool.setuptools]
include-package-data = true

# PEP 561: ship the inline-types marker so downstream mypy/pyright see power-loop's
# annotations (H3.3). Without this the entire annotated public API is invisible.
[tool.setuptools.package-data]
power_loop = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "power_loop.__version__" }

[tool.setuptools.packages.find]
include = ["power_loop*", "llm_client*"]
exclude = ["tests*", "docs*", "references*", "examples*", "temp*", "images*"]

# ── ruff ──
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".skills", "references", "temp", "outputs", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line-too-long handled by formatter
  "B008",  # function calls in default args — common in dataclass-style configs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "UP"]
"examples/**" = ["B", "UP"]

# ── mypy ──
# M0 基线：能跑、不破坏 import。strict 检查留给 M1 逐模块收紧（接触哪个收紧哪个）。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# 允许类型注解不完整；接触后逐步开 disallow_untyped_defs 等。
check_untyped_defs = false

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers: an unregistered marker is a collection error (catches typos).
# --strict-config: an unknown ini key is an error. Coverage flags are opt-in (CI).
addopts = "--strict-markers --strict-config"
markers = [
  "unit: pure control-flow / contract tests (fake LLM, fast)",
  "integration: multi-component scenarios with fake LLM",
  "real_llm: hits the real DashScope-compatible API; default ON locally, skipped if key missing",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

# ── coverage (opt-in: CI runs `pytest --cov=power_loop --cov=llm_client`) ──
[tool.coverage.run]
source = ["power_loop", "llm_client"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
]
